<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spanish side coming soon | Texas Bull Marketing</title>
  <meta name="description" content="The Spanish side of Texas Bull Marketing is coming soon." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#161C2A" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="canonical" href="https://texasbullmarketing.com/es/" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #161C2A;
      color: #fff;
      font-family: Inter, Segoe UI, sans-serif;
      transition: opacity .28s ease, transform .28s ease;
    }
    body.leave { opacity: 0; transform: translateY(10px); }
    main {
      width: min(100%, 32rem);
      text-align: center;
      animation: rise .45s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    img { width: 96px; height: 96px; object-fit: contain; }
    .kicker {
      margin: 24px 0 0;
      color: #C8102E;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    h1 { margin: 12px 0 0; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; }
    p { margin: 16px 0 0; color: rgba(255,255,255,.7); font-size: 1.05rem; }
    a.back {
      display: inline-flex;
      margin-top: 28px;
      padding: 16px 28px;
      border-radius: 999px;
      background: #C8102E;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      transition: background .2s ease, transform .2s ease;
    }
    a.back:hover { background: #a50d26; transform: translateY(-1px); }
  </style>
</head>
<body>
  <main>
    <img src="/bull-logo.webp" alt="Texas Bull Marketing" width="192" height="288" />
    <p class="kicker">Texas Bull Marketing</p>
    <h1>Spanish side coming soon</h1>
    <p>Use the English site for now.</p>
    <a class="back" id="to-en" href="/">Back to English</a>
  </main>
  <script>
    document.getElementById('to-en').addEventListener('click', function (e) {
      e.preventDefault();
      document.body.classList.add('leave');
      setTimeout(function () { location.href = '/'; }, 280);
    });
  </script>
</body>
</html>
